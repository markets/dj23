<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TAP BPM with Pitch Changes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-case {
            background: #2a2a2a;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .pass { background: #2d5a27; }
        .fail { background: #5a2727; }
        .result {
            font-weight: bold;
            margin: 10px 0;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #357abd;
        }
        .test-controls {
            margin: 20px 0;
        }
        .tap-demo {
            background: #3a3a3a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .tap-button {
            background: #e74c3c;
            font-size: 24px;
            padding: 20px 40px;
            margin: 10px;
        }
        .pitch-slider {
            margin: 10px 0;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Test TAP BPM with Pitch Changes</h1>
    
    <div class="test-controls">
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="test-results"></div>
    
    <div class="tap-demo">
        <h2>Manual TAP Test</h2>
        <div class="pitch-slider">
            <label for="pitchSlider">Pitch: </label>
            <input type="range" id="pitchSlider" min="-30" max="30" value="0" step="1">
            <span id="pitchDisplay">0%</span>
        </div>
        <div class="status">
            <div>Playback Rate: <span id="playbackRate">1.00</span></div>
            <div>Last TAP Interval: <span id="lastInterval">--</span></div>
            <div>Expected Interval (120 BPM): <span id="expectedInterval">500ms</span></div>
            <div>Calculated BPM: <span id="calculatedBPM">--</span></div>
        </div>
        <button class="tap-button" onclick="handleManualTap()">TAP</button>
        <button onclick="simulateTapping()">Auto TAP at 120 BPM</button>
        <button onclick="clearTapData()">Clear TAP Data</button>
    </div>

    <script>
        // Simulate the TAP functionality similar to deck.js
        let tapIntervals = [];
        let lastTapTime = null;
        let currentPlaybackRate = 1.0;
        
        // Update playback rate when pitch slider changes
        document.getElementById('pitchSlider').addEventListener('input', (e) => {
            const pitchValue = parseInt(e.target.value);
            currentPlaybackRate = 1 + (pitchValue / 100);
            document.getElementById('pitchDisplay').textContent = pitchValue + '%';
            document.getElementById('playbackRate').textContent = currentPlaybackRate.toFixed(2);
            
            // Update expected interval
            const baseInterval = 60000 / 120; // 120 BPM in system time
            const expectedInterval = baseInterval / currentPlaybackRate; // Adjusted for pitch
            document.getElementById('expectedInterval').textContent = expectedInterval.toFixed(1) + 'ms';
        });
        
        function handleManualTap() {
            const now = Date.now();
            
            if (lastTapTime) {
                const interval = now - lastTapTime;
                tapIntervals.push(interval);
                tapIntervals = tapIntervals.slice(-8); // Keep last 8 intervals
                
                document.getElementById('lastInterval').textContent = interval + 'ms';
                
                if (tapIntervals.length >= 2) {
                    const bpm = calculateTapBPM(tapIntervals);
                    document.getElementById('calculatedBPM').textContent = bpm;
                }
            }
            
            lastTapTime = now;
        }
        
        function calculateTapBPM(intervals) {
            if (intervals.length === 0) return 120;
            
            // Original implementation (PROBLEMATIC)
            const sortedIntervals = [...intervals].sort((a, b) => a - b);
            const medianInterval = getMedian(sortedIntervals);
            
            // Filter outliers
            const deviationThreshold = 0.25;
            const filteredIntervals = intervals.filter(interval => {
                const deviation = Math.abs(interval - medianInterval) / medianInterval;
                return deviation <= deviationThreshold;
            });
            
            if (filteredIntervals.length === 0) {
                return Math.round(60000 / medianInterval);
            }
            
            const finalSortedIntervals = [...filteredIntervals].sort((a, b) => a - b);
            const finalMedianInterval = getMedian(finalSortedIntervals);
            
            // This is the PROBLEM: we're using system clock intervals directly
            // but they need to be adjusted for playback rate
            return Math.round(60000 / finalMedianInterval);
        }
        
        function calculateTapBPMFixed(intervals, playbackRate) {
            if (intervals.length === 0) return 120;
            
            // Convert system time intervals to audio time intervals
            const audioIntervals = intervals.map(interval => interval * playbackRate);
            
            const sortedIntervals = [...audioIntervals].sort((a, b) => a - b);
            const medianInterval = getMedian(sortedIntervals);
            
            // Filter outliers
            const deviationThreshold = 0.25;
            const filteredIntervals = audioIntervals.filter(interval => {
                const deviation = Math.abs(interval - medianInterval) / medianInterval;
                return deviation <= deviationThreshold;
            });
            
            if (filteredIntervals.length === 0) {
                return Math.round(60000 / medianInterval);
            }
            
            const finalSortedIntervals = [...filteredIntervals].sort((a, b) => a - b);
            const finalMedianInterval = getMedian(finalSortedIntervals);
            
            return Math.round(60000 / finalMedianInterval);
        }
        
        function getMedian(sortedArray) {
            const length = sortedArray.length;
            if (length === 0) return 0;
            if (length % 2 === 0) {
                return (sortedArray[length / 2 - 1] + sortedArray[length / 2]) / 2;
            } else {
                return sortedArray[Math.floor(length / 2)];
            }
        }
        
        function clearTapData() {
            tapIntervals = [];
            lastTapTime = null;
            document.getElementById('lastInterval').textContent = '--';
            document.getElementById('calculatedBPM').textContent = '--';
        }
        
        function simulateTapping() {
            clearTapData();
            
            // Simulate tapping at 120 BPM in system time
            const baseBPM = 120;
            const baseInterval = 60000 / baseBPM; // 500ms
            
            let tapCount = 0;
            const maxTaps = 8;
            
            function doTap() {
                if (tapCount >= maxTaps) return;
                
                handleManualTap();
                tapCount++;
                
                // Schedule next tap with slight random variation
                const variation = (Math.random() - 0.5) * 20; // ±10ms variation
                const nextInterval = baseInterval + variation;
                setTimeout(doTap, nextInterval);
            }
            
            doTap();
        }
        
        // Test Cases
        function runTest(name, testFn) {
            const startTime = performance.now();
            try {
                const result = testFn();
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                
                if (result.passed) {
                    addTestResult(name, 'PASS', result.message, duration);
                } else {
                    addTestResult(name, 'FAIL', result.message, duration);
                }
            } catch (error) {
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                addTestResult(name, 'FAIL', `Error: ${error.message}`, duration);
            }
        }
        
        function addTestResult(name, status, message, duration) {
            const resultsDiv = document.getElementById('test-results');
            const testDiv = document.createElement('div');
            testDiv.className = `test-case ${status.toLowerCase()}`;
            testDiv.innerHTML = `
                <h3>${name}</h3>
                <div class="result">${status}</div>
                <div>${message}</div>
                <small>Duration: ${duration}ms</small>
            `;
            resultsDiv.appendChild(testDiv);
        }
        
        function clearResults() {
            document.getElementById('test-results').innerHTML = '';
        }
        
        // Test: BPM calculation without pitch changes
        function testBasicBPMCalculation() {
            const intervals = [500, 500, 500, 500]; // Perfect 120 BPM
            const bpm = calculateTapBPM(intervals);
            const expected = 120;
            
            return {
                passed: bpm === expected,
                message: `Expected: ${expected}, Actual: ${bpm}`
            };
        }
        
        // Test: BPM calculation with pitch +10%
        function testBPMWithPitchIncrease() {
            const playbackRate = 1.1; // +10% pitch
            
            // When pitch is +10%, audio plays 10% faster
            // So to tap at the same audio rhythm, we need to tap 10% faster in system time
            const baseBPM = 120;
            const systemInterval = (60000 / baseBPM) / playbackRate; // 454.5ms
            const intervals = [systemInterval, systemInterval, systemInterval, systemInterval];
            
            // Original method (should be wrong)
            const originalBPM = calculateTapBPM(intervals);
            
            // Fixed method (should be correct)
            const fixedBPM = calculateTapBPMFixed(intervals, playbackRate);
            
            return {
                passed: Math.abs(fixedBPM - baseBPM) <= 1 && Math.abs(originalBPM - baseBPM) > 5,
                message: `Base BPM: ${baseBPM}, Original method: ${originalBPM}, Fixed method: ${fixedBPM}, Playback rate: ${playbackRate}`
            };
        }
        
        // Test: BPM calculation with pitch -15%
        function testBPMWithPitchDecrease() {
            const playbackRate = 0.85; // -15% pitch
            
            const baseBPM = 120;
            const systemInterval = (60000 / baseBPM) / playbackRate; // 588.2ms
            const intervals = [systemInterval, systemInterval, systemInterval, systemInterval];
            
            const originalBPM = calculateTapBPM(intervals);
            const fixedBPM = calculateTapBPMFixed(intervals, playbackRate);
            
            return {
                passed: Math.abs(fixedBPM - baseBPM) <= 1 && Math.abs(originalBPM - baseBPM) > 5,
                message: `Base BPM: ${baseBPM}, Original method: ${originalBPM}, Fixed method: ${fixedBPM}, Playback rate: ${playbackRate}`
            };
        }
        
        function runAllTests() {
            clearResults();
            
            runTest('Basic BPM calculation (no pitch change)', testBasicBPMCalculation);
            runTest('BPM calculation with +10% pitch', testBPMWithPitchIncrease);
            runTest('BPM calculation with -15% pitch', testBPMWithPitchDecrease);
            
            // Add summary
            setTimeout(() => {
                const results = document.querySelectorAll('.test-case');
                const passed = document.querySelectorAll('.test-case.pass').length;
                const failed = document.querySelectorAll('.test-case.fail').length;
                
                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'test-case';
                summaryDiv.innerHTML = `
                    <h3>Test Summary</h3>
                    <div class="result">Tests: ${results.length}, Passed: ${passed}, Failed: ${failed}</div>
                    ${failed === 0 ? '<div style="color: #4CAF50;">All tests passed! ✅</div>' : '<div style="color: #f44336;">Some tests failed ❌</div>'}
                `;
                document.getElementById('test-results').appendChild(summaryDiv);
            }, 100);
        }
        
        // Run tests on page load
        window.addEventListener('load', () => {
            runAllTests();
        });
    </script>
</body>
</html>
