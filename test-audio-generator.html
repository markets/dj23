<!DOCTYPE html>
<html>
<head>
    <title>Generate Test Audio</title>
</head>
<body>
    <h1>Generate Test Audio with Silence</h1>
    <button id="generateAudio">Generate Test Audio with 2s Silence</button>
    <button id="downloadAudio" style="display:none;">Download Audio</button>
    <p id="status"></p>

    <script>
        document.getElementById('generateAudio').addEventListener('click', generateTestAudio);

        async function generateTestAudio() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Generating audio...';

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const sampleRate = 44100;
                const duration = 10; // 10 seconds total
                const silenceDuration = 2; // 2 seconds of silence at start
                const bpm = 120;
                const beatInterval = 60 / bpm; // 0.5 seconds per beat

                const buffer = audioContext.createBuffer(2, sampleRate * duration, sampleRate);
                
                // Generate audio data
                for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                    const channelData = buffer.getChannelData(channel);
                    
                    for (let i = 0; i < channelData.length; i++) {
                        const time = i / sampleRate;
                        
                        if (time < silenceDuration) {
                            // Silence for first 2 seconds
                            channelData[i] = 0;
                        } else {
                            // Generate a simple beat pattern after silence
                            const adjustedTime = time - silenceDuration;
                            const beatPosition = adjustedTime % beatInterval;
                            
                            // Create a kick drum on beat 1 and 3, snare on 2 and 4
                            let amplitude = 0;
                            if (beatPosition < 0.1) {
                                // Kick drum (beats 1 and 3)
                                const beatNumber = Math.floor(adjustedTime / beatInterval) % 4;
                                if (beatNumber === 0 || beatNumber === 2) {
                                    amplitude = 0.3 * Math.sin(2 * Math.PI * 60 * time) * Math.exp(-beatPosition * 20);
                                }
                                // Snare drum (beats 2 and 4)
                                else if (beatNumber === 1 || beatNumber === 3) {
                                    amplitude = 0.2 * (Math.random() * 2 - 1) * Math.exp(-beatPosition * 15);
                                }
                            }
                            
                            // Add some background bass
                            amplitude += 0.05 * Math.sin(2 * Math.PI * 80 * time);
                            
                            channelData[i] = amplitude;
                        }
                    }
                }

                // Convert to WAV format
                const wavBuffer = encodeWAV(buffer);
                const blob = new Blob([wavBuffer], { type: 'audio/wav' });
                
                // Create download link
                const url = URL.createObjectURL(blob);
                const downloadBtn = document.getElementById('downloadAudio');
                downloadBtn.style.display = 'inline';
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'test-audio-with-silence.wav';
                    a.click();
                };

                statusEl.textContent = 'Audio generated! Click download to save.';

            } catch (error) {
                statusEl.textContent = 'Error: ' + error.message;
            }
        }

        function encodeWAV(audioBuffer) {
            const length = audioBuffer.length;
            const numberOfChannels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const arrayBuffer = new ArrayBuffer(44 + length * numberOfChannels * 2);
            const view = new DataView(arrayBuffer);

            // WAV header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + length * numberOfChannels * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numberOfChannels * 2, true);
            view.setUint16(32, numberOfChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, length * numberOfChannels * 2, true);

            // PCM data
            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, audioBuffer.getChannelData(channel)[i]));
                    view.setInt16(offset, sample * 0x7FFF, true);
                    offset += 2;
                }
            }

            return arrayBuffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    </script>
</body>
</html>
