<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Fixed TAP BPM Implementation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-case {
            background: #2a2a2a;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .pass { background: #2d5a27; }
        .fail { background: #5a2727; }
        .result {
            font-weight: bold;
            margin: 10px 0;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #357abd;
        }
        .tap-simulation {
            background: #3a3a3a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .pitch-control {
            margin: 10px 0;
        }
        input[type="range"] {
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Test Fixed TAP BPM Implementation</h1>
    
    <div class="tap-simulation">
        <h2>TAP BPM Simulation with Fixed Algorithm</h2>
        <div class="pitch-control">
            <label for="pitchSlider">Pitch adjustment: </label>
            <input type="range" id="pitchSlider" min="-30" max="30" value="0" step="1">
            <span id="pitchDisplay">0%</span>
            <span id="playbackRateDisplay">(Rate: 1.00)</span>
        </div>
        <div>
            <button onclick="simulateNormalTapping()">Simulate 120 BPM TAP (Normal)</button>
            <button onclick="simulatePitchedTapping()">Simulate 120 BPM TAP (With Pitch)</button>
            <button onclick="clearSimulation()">Clear</button>
        </div>
        <div id="simulationResults" style="margin-top: 20px;"></div>
    </div>

    <div>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="test-results"></div>

    <script>
        let currentPlaybackRate = 1.0;
        
        // Update playback rate when pitch slider changes
        document.getElementById('pitchSlider').addEventListener('input', (e) => {
            const pitchValue = parseInt(e.target.value);
            currentPlaybackRate = 1 + (pitchValue / 100);
            document.getElementById('pitchDisplay').textContent = pitchValue + '%';
            document.getElementById('playbackRateDisplay').textContent = `(Rate: ${currentPlaybackRate.toFixed(2)})`;
        });
        
        // Fixed TAP BPM calculation that accounts for pitch changes
        function calculateTapBPMFixed(intervals, playbackRate) {
            if (intervals.length === 0) return 120;
            
            // Convert system time intervals to audio time intervals
            const audioIntervals = intervals.map(interval => interval * playbackRate);
            
            const sortedIntervals = [...audioIntervals].sort((a, b) => a - b);
            const medianInterval = getMedian(sortedIntervals);
            
            if (audioIntervals.length === 1) {
                return Math.round(60000 / medianInterval);
            }
            
            // Filter outliers
            const deviationThreshold = 0.25;
            const filteredIntervals = audioIntervals.filter(interval => {
                const deviation = Math.abs(interval - medianInterval) / medianInterval;
                return deviation <= deviationThreshold;
            });
            
            if (filteredIntervals.length === 0) {
                return Math.round(60000 / medianInterval);
            }
            
            const finalSortedIntervals = [...filteredIntervals].sort((a, b) => a - b);
            const finalMedianInterval = getMedian(finalSortedIntervals);
            
            return Math.round(60000 / finalMedianInterval);
        }
        
        function getMedian(sortedArray) {
            const length = sortedArray.length;
            if (length === 0) return 0;
            if (length % 2 === 0) {
                return (sortedArray[length / 2 - 1] + sortedArray[length / 2]) / 2;
            } else {
                return sortedArray[Math.floor(length / 2)];
            }
        }
        
        function simulateNormalTapping() {
            const playbackRate = 1.0;
            const intervals = generateTapIntervals(120, playbackRate, 6);
            const calculatedBPM = calculateTapBPMFixed(intervals, playbackRate);
            
            updateSimulationResults(`Normal Tapping (120 BPM, rate ${playbackRate}):`, intervals, calculatedBPM, 120);
        }
        
        function simulatePitchedTapping() {
            const intervals = generateTapIntervals(120, currentPlaybackRate, 6);
            const calculatedBPM = calculateTapBPMFixed(intervals, currentPlaybackRate);
            
            updateSimulationResults(`Pitched Tapping (120 BPM, rate ${currentPlaybackRate.toFixed(2)}):`, intervals, calculatedBPM, 120);
        }
        
        function generateTapIntervals(targetBPM, playbackRate, count) {
            const baseInterval = 60000 / targetBPM; // Target BPM in audio time
            const systemInterval = baseInterval / playbackRate; // Convert to system time
            
            const intervals = [];
            for (let i = 0; i < count; i++) {
                // Add some random variation (±5ms)
                const variation = (Math.random() - 0.5) * 10;
                intervals.push(systemInterval + variation);
            }
            return intervals;
        }
        
        function updateSimulationResults(title, intervals, calculatedBPM, expectedBPM) {
            const resultsDiv = document.getElementById('simulationResults');
            const accuracy = Math.abs(calculatedBPM - expectedBPM);
            const isAccurate = accuracy <= 2;
            
            resultsDiv.innerHTML = `
                <h3>${title}</h3>
                <div>Intervals: ${intervals.map(i => i.toFixed(1) + 'ms').join(', ')}</div>
                <div>Expected BPM: ${expectedBPM}</div>
                <div>Calculated BPM: ${calculatedBPM}</div>
                <div style="color: ${isAccurate ? '#4CAF50' : '#f44336'}">
                    Accuracy: ${isAccurate ? 'PASS' : 'FAIL'} (±${accuracy} BPM)
                </div>
            `;
        }
        
        function clearSimulation() {
            document.getElementById('simulationResults').innerHTML = '';
        }
        
        // Test Cases
        function runTest(name, testFn) {
            const startTime = performance.now();
            try {
                const result = testFn();
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                
                if (result.passed) {
                    addTestResult(name, 'PASS', result.message, duration);
                } else {
                    addTestResult(name, 'FAIL', result.message, duration);
                }
            } catch (error) {
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                addTestResult(name, 'FAIL', `Error: ${error.message}`, duration);
            }
        }
        
        function addTestResult(name, status, message, duration) {
            const resultsDiv = document.getElementById('test-results');
            const testDiv = document.createElement('div');
            testDiv.className = `test-case ${status.toLowerCase()}`;
            testDiv.innerHTML = `
                <h3>${name}</h3>
                <div class="result">${status}</div>
                <div>${message}</div>
                <small>Duration: ${duration}ms</small>
            `;
            resultsDiv.appendChild(testDiv);
        }
        
        function clearResults() {
            document.getElementById('test-results').innerHTML = '';
        }
        
        // Test: Fixed BPM calculation with no pitch changes
        function testFixedBPMNormal() {
            const intervals = [500, 500, 500, 500]; // Perfect 120 BPM
            const bpm = calculateTapBPMFixed(intervals, 1.0);
            const expected = 120;
            
            return {
                passed: bpm === expected,
                message: `Expected: ${expected}, Actual: ${bpm} (Rate: 1.00)`
            };
        }
        
        // Test: Fixed BPM calculation with +10% pitch
        function testFixedBPMPitchUp() {
            const playbackRate = 1.1;
            const targetBPM = 120;
            
            // Generate intervals as they would appear in system time when tapping to pitch-adjusted audio
            const audioInterval = 60000 / targetBPM; // 500ms in audio time
            const systemInterval = audioInterval / playbackRate; // 454.5ms in system time
            const intervals = [systemInterval, systemInterval, systemInterval, systemInterval];
            
            const bpm = calculateTapBPMFixed(intervals, playbackRate);
            
            return {
                passed: Math.abs(bpm - targetBPM) <= 1,
                message: `Expected: ${targetBPM}, Actual: ${bpm} (Rate: ${playbackRate})`
            };
        }
        
        // Test: Fixed BPM calculation with -15% pitch
        function testFixedBPMPitchDown() {
            const playbackRate = 0.85;
            const targetBPM = 120;
            
            const audioInterval = 60000 / targetBPM; // 500ms in audio time
            const systemInterval = audioInterval / playbackRate; // 588.2ms in system time
            const intervals = [systemInterval, systemInterval, systemInterval, systemInterval];
            
            const bpm = calculateTapBPMFixed(intervals, playbackRate);
            
            return {
                passed: Math.abs(bpm - targetBPM) <= 1,
                message: `Expected: ${targetBPM}, Actual: ${bpm} (Rate: ${playbackRate})`
            };
        }
        
        // Test: Edge case with extreme pitch changes
        function testFixedBPMExtremePitch() {
            const playbackRate = 1.3; // +30% pitch
            const targetBPM = 128;
            
            const audioInterval = 60000 / targetBPM;
            const systemInterval = audioInterval / playbackRate;
            const intervals = [systemInterval, systemInterval, systemInterval, systemInterval, systemInterval];
            
            const bpm = calculateTapBPMFixed(intervals, playbackRate);
            
            return {
                passed: Math.abs(bpm - targetBPM) <= 2,
                message: `Expected: ${targetBPM}, Actual: ${bpm} (Rate: ${playbackRate})`
            };
        }
        
        function runAllTests() {
            clearResults();
            
            runTest('Fixed BPM calculation (no pitch)', testFixedBPMNormal);
            runTest('Fixed BPM calculation (+10% pitch)', testFixedBPMPitchUp);
            runTest('Fixed BPM calculation (-15% pitch)', testFixedBPMPitchDown);
            runTest('Fixed BPM calculation (+30% pitch)', testFixedBPMExtremePitch);
            
            // Add summary
            setTimeout(() => {
                const results = document.querySelectorAll('.test-case');
                const passed = document.querySelectorAll('.test-case.pass').length;
                const failed = document.querySelectorAll('.test-case.fail').length;
                
                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'test-case';
                summaryDiv.innerHTML = `
                    <h3>Test Summary</h3>
                    <div class="result">Tests: ${results.length}, Passed: ${passed}, Failed: ${failed}</div>
                    ${failed === 0 ? '<div style="color: #4CAF50;">All tests passed! ✅ TAP BPM fix is working correctly.</div>' : '<div style="color: #f44336;">Some tests failed ❌</div>'}
                `;
                document.getElementById('test-results').appendChild(summaryDiv);
            }, 100);
        }
        
        // Run tests on page load
        window.addEventListener('load', () => {
            runAllTests();
        });
    </script>
</body>
</html>
