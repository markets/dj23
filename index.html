<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DJ Mixer Pro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="mixer-container">
        <!-- Header -->
        <header class="mixer-header">
            <h1>DJ Mixer Pro</h1>
            <div class="master-controls">
                <div class="master-volume">
                    <label>Master</label>
                    <input type="range" id="masterVolume" min="0" max="100" value="75" class="volume-slider">
                    <span class="volume-display">75%</span>
                </div>
            </div>
        </header>

        <!-- Main Mixer Interface -->
        <div class="mixer-interface">
            <!-- Deck A -->
            <div class="deck" id="deckA">
                <div class="deck-header">
                    <h2>Deck A</h2>
                    <input type="file" id="fileInputA" accept="audio/*" class="file-input">
                    <label for="fileInputA" class="load-button">Load Track</label>
                </div>

                <div class="track-info" id="trackInfoA">
                    <div class="track-name">No track loaded</div>
                    <div class="track-time">00:00 / 00:00</div>
                </div>

                <div class="waveform-container">
                    <canvas id="waveformA" class="waveform"></canvas>
                    <div class="playhead" id="playheadA"></div>
                </div>

                <div class="transport-controls">
                    <button id="playA" class="play-btn">▶</button>
                    <button id="pauseA" class="pause-btn">⏸</button>
                    <button id="stopA" class="stop-btn">⏹</button>
                    <button id="cueA" class="cue-btn">CUE</button>
                </div>

                <div class="pitch-control">
                    <label>Pitch</label>
                    <input type="range" id="pitchA" min="-50" max="50" value="0" class="pitch-slider">
                    <span id="pitchDisplayA">0%</span>
                </div>

                <div class="eq-section">
                    <div class="eq-band">
                        <label>High</label>
                        <input type="range" id="highA" min="-20" max="20" value="0" class="eq-slider" orient="vertical">
                        <span class="eq-value">0</span>
                    </div>
                    <div class="eq-band">
                        <label>Mid</label>
                        <input type="range" id="midA" min="-20" max="20" value="0" class="eq-slider" orient="vertical">
                        <span class="eq-value">0</span>
                    </div>
                    <div class="eq-band">
                        <label>Low</label>
                        <input type="range" id="lowA" min="-20" max="20" value="0" class="eq-slider" orient="vertical">
                        <span class="eq-value">0</span>
                    </div>
                </div>

                <div class="effects-section">
                    <div class="effect">
                        <label>Filter</label>
                        <input type="range" id="filterA" min="0" max="100" value="50" class="effect-slider">
                    </div>
                    <div class="effect">
                        <label>Reverb</label>
                        <input type="range" id="reverbA" min="0" max="100" value="0" class="effect-slider">
                    </div>
                    <div class="effect">
                        <label>Delay</label>
                        <input type="range" id="delayA" min="0" max="100" value="0" class="effect-slider">
                    </div>
                </div>

                <div class="volume-control">
                    <label>Volume</label>
                    <input type="range" id="volumeA" min="0" max="100" value="75" class="volume-slider">
                    <span class="volume-display">75%</span>
                </div>
            </div>

            <!-- Center Mixer Section -->
            <div class="center-mixer">
                <div class="crossfader-section">
                    <label>Crossfader</label>
                    <input type="range" id="crossfader" min="0" max="100" value="50" class="crossfader">
                    <div class="crossfader-labels">
                        <span>A</span>
                        <span>B</span>
                    </div>
                </div>

                <div class="bpm-section">
                    <div class="bpm-display">
                        <div class="bpm-deck">
                            <label>BPM A</label>
                            <span id="bpmA">--</span>
                        </div>
                        <div class="bpm-deck">
                            <label>BPM B</label>
                            <span id="bpmB">--</span>
                        </div>
                    </div>
                    <button id="syncAB" class="sync-btn">SYNC A→B</button>
                    <button id="syncBA" class="sync-btn">SYNC B→A</button>
                </div>

                <div class="cue-controls">
                    <div class="cue-volume">
                        <label>Cue Volume</label>
                        <input type="range" id="cueVolume" min="0" max="100" value="75" class="volume-slider">
                    </div>
                    <div class="cue-mix">
                        <label>Cue Mix</label>
                        <input type="range" id="cueMix" min="0" max="100" value="0" class="volume-slider">
                    </div>
                </div>
            </div>

            <!-- Deck B -->
            <div class="deck" id="deckB">
                <div class="deck-header">
                    <h2>Deck B</h2>
                    <input type="file" id="fileInputB" accept="audio/*" class="file-input">
                    <label for="fileInputB" class="load-button">Load Track</label>
                </div>

                <div class="track-info" id="trackInfoB">
                    <div class="track-name">No track loaded</div>
                    <div class="track-time">00:00 / 00:00</div>
                </div>

                <div class="waveform-container">
                    <canvas id="waveformB" class="waveform"></canvas>
                    <div class="playhead" id="playheadB"></div>
                </div>

                <div class="transport-controls">
                    <button id="playB" class="play-btn">▶</button>
                    <button id="pauseB" class="pause-btn">⏸</button>
                    <button id="stopB" class="stop-btn">⏹</button>
                    <button id="cueB" class="cue-btn">CUE</button>
                </div>

                <div class="pitch-control">
                    <label>Pitch</label>
                    <input type="range" id="pitchB" min="-50" max="50" value="0" class="pitch-slider">
                    <span id="pitchDisplayB">0%</span>
                </div>

                <div class="eq-section">
                    <div class="eq-band">
                        <label>High</label>
                        <input type="range" id="highB" min="-20" max="20" value="0" class="eq-slider" orient="vertical">
                        <span class="eq-value">0</span>
                    </div>
                    <div class="eq-band">
                        <label>Mid</label>
                        <input type="range" id="midB" min="-20" max="20" value="0" class="eq-slider" orient="vertical">
                        <span class="eq-value">0</span>
                    </div>
                    <div class="eq-band">
                        <label>Low</label>
                        <input type="range" id="lowB" min="-20" max="20" value="0" class="eq-slider" orient="vertical">
                        <span class="eq-value">0</span>
                    </div>
                </div>

                <div class="effects-section">
                    <div class="effect">
                        <label>Filter</label>
                        <input type="range" id="filterB" min="0" max="100" value="50" class="effect-slider">
                    </div>
                    <div class="effect">
                        <label>Reverb</label>
                        <input type="range" id="reverbB" min="0" max="100" value="0" class="effect-slider">
                    </div>
                    <div class="effect">
                        <label>Delay</label>
                        <input type="range" id="delayB" min="0" max="100" value="0" class="effect-slider">
                    </div>
                </div>

                <div class="volume-control">
                    <label>Volume</label>
                    <input type="range" id="volumeB" min="0" max="100" value="75" class="volume-slider">
                    <span class="volume-display">75%</span>
                </div>
            </div>
        </div>

        <!-- VU Meters -->
        <div class="vu-meters">
            <div class="vu-meter">
                <label>Deck A</label>
                <div class="vu-bars" id="vuA"></div>
            </div>
            <div class="vu-meter">
                <label>Master</label>
                <div class="vu-bars" id="vuMaster"></div>
            </div>
            <div class="vu-meter">
                <label>Deck B</label>
                <div class="vu-bars" id="vuB"></div>
            </div>
        </div>
    </div>

    <script src="js/audio-engine.js"></script>
    <script src="js/waveform.js"></script>
    <script src="js/mixer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
